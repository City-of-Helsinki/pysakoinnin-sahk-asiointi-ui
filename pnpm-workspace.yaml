# Minimum age for new packages before they can be used (in minutes) – 10080 min = 1 week
minimumReleaseAge: 10080

# For emergency security fixes, a too new version can be allowed temporarily
# with minimumReleaseAgeExclude (e.g. `- pkg@1.2.3`). Remove the entry once the
# version is older than minimumReleaseAge.

# Hoist all dependencies to the root of node_modules because some packages
# (e.g. the draft-js ecosystem) do not work correctly with pnpm's default isolation strategy
shamefullyHoist: true

# Allow plugins that lag on peer ranges to load under ESLint 10.
# - eslint-plugin-jsx-a11y@6.10.2: peer eslint ^3 || ... || ^9
peerDependencyRules:
  allowedVersions:
    eslint: '10'

# pnpm 11 requires explicit opt-in for packages that run install scripts.
# - esbuild: downloads its native binary during installation (used by tsx and vite)
# - unrs-resolver: Rust-based module resolver used by eslint-plugin-import-x
allowBuilds:
  esbuild: true
  unrs-resolver: true
